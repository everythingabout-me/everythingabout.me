<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Everything About Me 注册验证码</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f7f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#161a19;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f7f6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#ffffff;border:1px solid #e8eae9;border-radius:18px;padding:32px;">
            <tr>
              <td style="padding-bottom:20px;">
                <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#1fa98a;margin-right:8px;vertical-align:middle;"></span>
                <span style="font-size:14px;font-weight:600;color:#161a19;vertical-align:middle;">Everything About Me</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:20px;font-weight:600;color:#161a19;padding-bottom:8px;">注册验证码</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:1.7;color:#5b6462;padding-bottom:20px;">你正在注册 Everything About Me。请在页面中输入下面的验证码：</td>
            </tr>
            <tr>
              <td align="center" style="padding:18px 0 22px;">
                <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:10px;color:#15836a;background:#eaf8f3;border-radius:12px;padding:16px 12px;">{{code}}</div>
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:1.7;color:#5b6462;padding-bottom:8px;">验证码 10 分钟内有效，只能使用一次。</td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.7;color:#929b98;padding-bottom:20px;">如果这不是你本人的操作，请忽略这封邮件，不要将验证码转发给任何人。</td>
            </tr>
            <tr>
              <td style="border-top:1px solid #e8eae9;padding-top:18px;font-size:12px;line-height:1.6;color:#929b98;">此邮件由 Everything About Me 自动发送，请勿直接回复。</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
