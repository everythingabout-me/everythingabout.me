    Seam stroke 72 (3× the old stepped 24u line, ≈1.5px at the 21px topbar size),
    butt caps, clipped to the disc.
    Palette: #FD605E red / #13A7F5 blue / #FFFFFF seam.
    No filters anywhere: the mark stays vector-crisp from 21px to a 1024 export.
  -->
